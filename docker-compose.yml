services:
  ne_desem_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://ne_desem:change_me@db:5432/ne_desem}
      AUTH_SECRET: ${AUTH_SECRET:-change_me_long_random_string}
      AI_MODE: ${AI_MODE:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      ne_desem_db:
        condition: service_healthy
    networks:
      - ne_desem_network

  ne_desem_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ne_desem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ne_desem}
    ports:
      - "5432:5432"
    volumes:
      - ne_desem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      ne_desem_network:
        aliases:
          - db

networks:
  ne_desem_network:
    name: ne_desem_network

volumes:
  ne_desem_postgres_data:
    name: ne_desem_postgres_data
